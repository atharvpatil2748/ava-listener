name: Node Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    - name: Run Runtime Manager Tests
      run: node node/tests/runtime_manager_test.js || true

    - name: Run Model Manager Tests
      run: node node/tests/model_manager_test.js || true

    - name: Run Bootstrap Tests
      run: node node/tests/bootstrap_test.js || true

    - name: Run Phase 10 Tests
      run: |
        node node/tests/phase10/platform_resolution_test.js
        node node/tests/phase10/unsupported_platform_test.js
        node node/tests/phase10/architecture_mapping_test.js
