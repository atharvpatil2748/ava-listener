name: Release Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        
    - name: Install dependencies
      run: npm ci

    - name: Release Manifest Schema Validation
      run: node node/tests/phase10/release_manifest_test.js

    - name: Missing Release Asset Handling
      run: node node/tests/phase10/missing_release_asset_test.js

    - name: Invalid Manifest Handling
      run: node node/tests/phase10/invalid_manifest_test.js

    - name: Release Asset Resolution
      run: node node/tests/phase10/release_asset_resolution_test.js

    - name: GitHub Asset Resolution
      run: node node/tests/phase10/github_asset_resolution_test.js

    - name: Checksum Generation
      run: node node/tests/phase10/checksum_generation_test.js
