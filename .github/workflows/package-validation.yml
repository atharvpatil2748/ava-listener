name: Package Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run Package Layout Test
      run: node node/tests/phase10/package_layout_test.js

    - name: Run NPM Pack Test
      run: node node/tests/phase10/npm_pack_test.js

    - name: Run Package Size Validation Test
      run: node node/tests/phase10/package_size_test.js

    - name: Run Local Install Test
      run: node node/tests/phase10/local_install_test.js

    - name: Run Fresh Install Test
      run: node node/tests/phase10/fresh_install_test.js

    - name: Find and Upload Tarball
      uses: actions/upload-artifact@v4
      with:
        name: npm-tarball
        path: "*.tgz"
